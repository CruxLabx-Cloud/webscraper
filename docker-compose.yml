version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: citracker-postgres
    environment:
      POSTGRES_USER: citracker
      POSTGRES_PASSWORD: citracker
      POSTGRES_DB: citracker
    ports:
      - "5432:5432"
    volumes:
      - citracker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citracker"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - citracker

  backend:
    build: ./backend
    container_name: citracker-backend
    ports:
      - "8000:8000"
    environment:
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      - CORS_ORIGINS=http://frontend:3000,http://localhost:3000,http://localhost:3001
      - DATABASE_URL=postgresql+asyncpg://citracker:citracker@postgres:5432/citracker
      - JWT_SECRET=${JWT_SECRET:-dev-secret-change-me}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-Company Intelligence <noreply@citracker.local>}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:3000}
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - citracker

  frontend:
    build: ./frontend
    container_name: citracker-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - citracker

networks:
  citracker:
    driver: bridge

volumes:
  citracker_pgdata:
